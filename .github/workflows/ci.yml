name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Check sources, strict build and local links
        run: python scripts/docs.py check
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        env:
          ENABLE_GIT_DATES: 'true'
        run: .venv/bin/python -m mkdocs gh-deploy --strict --force
