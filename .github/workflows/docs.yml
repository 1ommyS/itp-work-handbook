name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Check sources, strict build, local links and anchors
        run: python scripts/docs.py check
      - uses: actions/upload-artifact@v4
        with:
          name: handbook-site
          path: site/

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python scripts/docs.py bootstrap
      - name: Publish with MkDocs, as in itp-ebook
        env:
          ENABLE_GIT_DATES: 'true'
        run: .venv/bin/python -m mkdocs gh-deploy --strict --force
