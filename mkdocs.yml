site_name: Работа в IT — handbook 2026
site_description: Практическое руководство по поиску работы в IT в России — от выбора цели до проверки оффера.
exclude_docs: |
  !/templates/
site_url: https://1ommys.github.io/itp-work-handbook/
repo_name: 1ommyS/itp-work-handbook
repo_url: https://github.com/1ommyS/itp-work-handbook
edit_uri: edit/main/docs/
copyright: Материалы проверены 6 сентября 2026 года. Даты источников указаны в тексте.

theme:
  name: material
  language: ru
  font: false
  icon:
    repo: fontawesome/brands/github
    logo: material/briefcase-outline
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.instant
    - navigation.instant.progress
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - ru
        - en
  - git-revision-date-localized:
      enabled: !ENV [ENABLE_GIT_DATES, false]
      enable_creation_date: true
      fallback_to_build_date: true
      locale: ru
      type: date

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
    absolute_links: warn

nav:
  - Начало: index.md
  - Стратегия:
      - Рынок России в 2026 году: getting-started/market-2026.md
      - Цель и выбор работодателя: getting-started/target.md
      - План поиска работы: getting-started/plan.md
      - Без коммерческого опыта: getting-started/no-experience.md
  - Резюме и профиль:
      - Резюме для российского рынка: resume/resume.md
      - Примеры формулировок: resume/examples.md
      - Профиль и портфолио: resume/profile.md
  - Поиск вакансий:
      - Каналы поиска: job-search/channels.md
      - Отклики и воронка: job-search/applications.md
      - Общение с рекрутером: job-search/recruiter.md
      - Отказы и диагностика: job-search/rejections.md
  - Собеседования:
      - Этапы найма: interviews/process.md
      - Поведенческое интервью: interviews/behavioral.md
      - Вопросы компании: interviews/company.md
  - Практикум собеседований:
      - Как работать с базой: interview-bank/index.md
      - Java — 240 вопросов:
          - Карта раздела: interview-bank/java.md
          - 1–80 · Java Core: interview-bank/java-core.md
          - 81–160 · JVM и Concurrency: interview-bank/java-runtime.md
          - 161–240 · Spring, Data, Architecture: interview-bank/java-ecosystem.md
      - 50 задач LeetCode: interview-bank/leetcode-50.md
  - Техническая подготовка:
      - Разработчикам: technical/developer.md
      - Алгоритмы и live coding: technical/algorithms.md
      - System Design по уровням: technical/system-design.md
      - QA, аналитика, DevOps, дизайн и продукт: technical/roles.md
  - Зарплата и оффер:
      - Ожидания и переговоры: salary/negotiation.md
      - Проверка оффера: salary/offer.md
  - Шаблоны: templates/index.md
  - Источники: resources/sources.md
